server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: jotlog

  # 默认激活 local。config/application-local.yml 会覆盖下面的占位符默认值。
  # 部署到服务器时用 JOTLOG_PROFILE=prod 或直接 --spring.profiles.active=prod 改。
  profiles:
    active: ${JOTLOG_PROFILE:local}

  datasource:
    # 这个文件会进 Git，所以这里只放占位符，不写真值。
    # 真值放 config/application-local.yml（已 gitignore），它会自动覆盖这里。
    #
    # ⚠️ characterEncoding 只能写 UTF-8，不能写 utf8mb4。
    #    utf8mb4 是 MySQL 的字符集名，但这个参数走的是 Java 的 String.getBytes()，
    #    Java 里没有叫 utf8mb4 的字符集 → 直接抛
    #    "Unsupported character encoding 'utf8mb4'"，应用起不来。
    #    Connector/J 会把 UTF-8 自动映射为 MySQL 的 utf8mb4。
    url: jdbc:mysql://${JOTLOG_DB_HOST:127.0.0.1}:${JOTLOG_DB_PORT:3306}/jotlog?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${JOTLOG_DB_USER:root}
    password: ${JOTLOG_DB_PASSWORD:}
    hikari:
      # 个人笔记量级，连接池开小点就够
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      pool-name: jotlog-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jotlog:
  channel:
    feishu:
      # 改成 true 才会连飞书。没配凭证时保持 false，应用仍能正常启动。
      enabled: ${FEISHU_ENABLED:false}
      # 真值放 config/application-local.yml。App Secret 一旦进 Git 就永久泄露。
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 群聊里只响应 @ 机器人的消息
      mention-only: true
      receipt-text: "已记下，稍后补全"
  storage:
    attachment-dir: ${JOTLOG_ATTACHMENT_DIR:./data/attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.jotlog: INFO
    com.lark.oapi: WARN
