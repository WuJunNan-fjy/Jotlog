server:
  # 8080 常被本机其他项目占用，Jotlog 默认改用 8095，避免每次启动都要手动改
  port: ${JOTLOG_PORT:8095}
  shutdown: graceful

spring:
  application:
    name: jotlog

  # 默认激活 local（开发）：application-local.yml 覆盖下面的占位符。
  # 部署到服务器时用 JOTLOG_PROFILE=prod 或 --spring.profiles.active=prod，
  # 真值读 application-prod.yml（两个文件都已 gitignore）。
  profiles:
    active: ${JOTLOG_PROFILE:local}

  datasource:
    # 这个文件会进 Git，所以这里只放占位符，不写真值。
    # 真值放 application-local.yml / application-prod.yml（均已 gitignore），会自动覆盖这里。
    #
    # ⚠️ characterEncoding 只能写 UTF-8，不能写 utf8mb4。
    #    utf8mb4 是 MySQL 的字符集名，但这个参数走的是 Java 的 String.getBytes()，
    #    Java 里没有叫 utf8mb4 的字符集 → 直接抛
    #    "Unsupported character encoding 'utf8mb4'"，应用起不来。
    #    Connector/J 会把 UTF-8 自动映射为 MySQL 的 utf8mb4。
    url: jdbc:mysql://${JOTLOG_DB_HOST:127.0.0.1}:${JOTLOG_DB_PORT:3306}/jotlog?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${JOTLOG_DB_USER:root}
    password: ${JOTLOG_DB_PASSWORD:}
    hikari:
      # 个人笔记量级，连接池开小点就够
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      pool-name: jotlog-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 登录验证码走 SMTP。没配 host 时 JavaMailSender 仍然会被创建，
  # 但发信必失败，EmailService 会按"未配置"处理并给出明确提示。
  mail:
    host: ${JOTLOG_MAIL_HOST:}
    port: ${JOTLOG_MAIL_PORT:587}
    username: ${JOTLOG_MAIL_USERNAME:}
    password: ${JOTLOG_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 587 = STARTTLS（先明文握手再升级）；465 = 隐式 SSL（一上来就 TLS）。
          # 两个只能开一个。默认按 587 配，用 465 时把 starttls 关掉、ssl 打开：
          #   JOTLOG_MAIL_PORT=465 JOTLOG_MAIL_STARTTLS=false JOTLOG_MAIL_SSL=true
          # 否则会出现「连上了但握手失败」这类难查的报错。
          starttls:
            enable: ${JOTLOG_MAIL_STARTTLS:true}
          ssl:
            enable: ${JOTLOG_MAIL_SSL:false}
          # 连接超时写短一点，SMTP 连不上时不至于把登录请求卡死
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 网页端附件上传。默认单文件 1MB 太小（手机截图都不止），放到 20MB。
  # request 比 file 略大：multipart 包装本身有开销。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jotlog:
  # ---------- 鉴权 ----------
  # 单用户自托管：没有注册入口，初始账号由下面的配置在首次启动时建出来。
  # 建好之后 password 就不再生效了，之后改密码走数据库（设置页）。
  auth:
    username: ${JOTLOG_AUTH_USERNAME:admin}
    email: ${JOTLOG_AUTH_EMAIL:}
    password: ${JOTLOG_AUTH_PASSWORD:}
    # 留空则启动时随机生成，代价是重启后所有人要重新登录
    jwt-secret: ${JOTLOG_JWT_SECRET:}
    jwt-ttl-hours: 168
    code-ttl-minutes: 5
    code-cooldown-seconds: 60
    max-attempts: 5
    lock-minutes: 30
    bootstrap: true
    # 开发用：没配 SMTP 时把验证码只写日志，不真的发信。生产必须 false。
    dev-code-to-log: ${JOTLOG_DEV_CODE_TO_LOG:false}

  mail:
    # 留空则回落到 spring.mail.username
    from: ${JOTLOG_MAIL_FROM:}
    personal: Jotlog

  channel:
    feishu:
      # 改成 true 才会连飞书。没配凭证时保持 false，应用仍能正常启动。
      enabled: ${FEISHU_ENABLED:false}
      # 真值放 application-local/prod.yml。App Secret 一旦进 Git 就永久泄露。
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 群聊里只响应 @ 机器人的消息
      mention-only: true
      receipt-text: "已记下，稍后补全"
  storage:
    # local=写本机磁盘（默认）；oss=阿里云 OSS。切 oss 必须配齐下面四项
    type: ${JOTLOG_STORAGE_TYPE:local}
    attachment-dir: ${JOTLOG_ATTACHMENT_DIR:./data/attachments}
    gc:
      # 附件垃圾回收：每天凌晨把存储后端里已无任何条目引用的对象删掉。
      # 条目删除时文件不能立即删（同 sha 可能被多条记录共享），统一靠它对账回收。
      # 想彻底关掉设 JOTLOG_STORAGE_GC_ENABLED=false。
      enabled: ${JOTLOG_STORAGE_GC_ENABLED:true}
      cron: ${JOTLOG_STORAGE_GC_CRON:0 40 3 * * ?}
    oss:
      endpoint: ${JOTLOG_OSS_ENDPOINT:}
      access-key-id: ${JOTLOG_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${JOTLOG_OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${JOTLOG_OSS_BUCKET_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # 邮件是可选通道，SMTP 没配时不该把整站健康拉成 DOWN
      enabled: true

logging:
  level:
    com.jotlog: INFO
    com.lark.oapi: WARN
